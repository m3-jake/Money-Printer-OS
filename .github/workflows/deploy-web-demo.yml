name: Deploy web demo

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'web-demo/**'
      - 'scripts/web-demo/**'
      - 'tests/web-demo.test.mjs'
      - 'tests/visual-contract.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: web-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish moneyprinter.bangbowbing.net
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check browser demo and shared HUD
        run: node --test tests/web-demo.test.mjs tests/visual-contract.test.mjs

      - name: Build browser demo
        run: npm run web-demo:build

      - name: Check Cloudflare credentials
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as repository Actions secrets.'
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web-demo/dist --project-name=money-printer --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
