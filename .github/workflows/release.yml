# Money Printer OS — release build.
#
# Builds the unified macOS arm64 + Windows x64 packages exactly as `npm run release:unified` does on
# bing's Mac (scripts/build-unified.mjs), then attaches them to a DRAFT GitHub Release. Nothing here
# signs anything and nothing is published: the installed app only trusts a release that carries a
# manifest.json signed with the Ed25519 release key, which bing produces by hand on the machine that
# holds that key (docs/RELEASE-CHANNEL.md). Until that manifest is uploaded and the draft is
# published, the updater cannot see the release at all.
#
# Runs on a `v*` tag push or by hand. macOS runners bill at 10x, so this is deliberately not a
# per-push job; CI (ci.yml) is the per-push gate.
name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Pass --skip-tests to the build (only when CI is already green on this commit)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unified:
    name: unified mac arm64 + windows x64
    # Apple silicon: scripts/build-unified.mjs refuses anything but darwin/arm64 (codesign, ditto, plutil).
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MODE: paper
      DOCTOR_OFFLINE: '1'
      FORCE_COLOR: '0'
      MONEY_PRINTER_DATA_DIR: ${{ runner.temp }}/mpo-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The build re-runs npm run test:all unless skip_tests is set; the visual suite needs Pillow.
      - uses: actions/setup-python@v5
        if: ${{ !inputs.skip_tests }}
        with:
          python-version: '3.12'
      - name: Install Pillow
        if: ${{ !inputs.skip_tests }}
        run: python3 -m pip install --quiet pillow

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$v"
            exit 1
          fi

      - name: Build (scripts/build-unified.mjs)
        run: |
          set -euo pipefail
          OUT_ROOT="$RUNNER_TEMP/mpo-release"
          node scripts/build-unified.mjs --out-root "$OUT_ROOT" --cache "$RUNNER_TEMP/mpo-runtimes" ${{ inputs.skip_tests && '--skip-tests' || '' }}
          OUT="$(ls -d "$OUT_ROOT"/Unified-* | head -n 1)"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Stage the unsigned updater manifest
        run: node scripts/sign-manifest.mjs stage --asar "$OUT/app.asar" --out "$OUT/manifest.unsigned.json"

      - name: Job summary
        run: |
          {
            echo '## Money Printer OS unified build'
            echo
            echo '```'
            cat "$OUT/SHA256SUMS.txt"
            echo '```'
            echo
            echo 'Updater manifest: **unsigned** (`manifest.unsigned.json`). Sign it by hand per `docs/RELEASE-CHANNEL.md`; the updater ignores this release until `manifest.json` is attached and the draft is published.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: money-printer-os-unified-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.OUT }}/*.zip
            ${{ env.OUT }}/app.asar
            ${{ env.OUT }}/SHA256SUMS.txt
            ${{ env.OUT }}/RELEASE.json
            ${{ env.OUT }}/PACKAGE-VERIFICATION.json
            ${{ env.OUT }}/MAC-ENGINE-SMOKE.json
            ${{ env.OUT }}/START-HERE.txt
            ${{ env.OUT }}/manifest.unsigned.json
            ${{ env.OUT }}/logs/**

      - name: Draft GitHub Release (tags only; never published here)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Money Printer OS $tag — unified macOS arm64 + Windows x64 build of $GITHUB_SHA (scripts/build-unified.mjs)."
            echo
            echo '**Draft: the updater manifest is unsigned.** Before publishing, on the machine holding the release key:'
            echo
            echo '```'
            echo 'node scripts/sign-manifest.mjs sign   --asar app.asar --key <release-private-key.pem>'
            echo 'node scripts/sign-manifest.mjs verify --manifest manifest.json --asar app.asar'
            echo '```'
            echo
            echo 'then upload the resulting `manifest.json` to this release and publish it (docs/RELEASE-CHANNEL.md). Installed copies pick it up on their next check.'
            echo
            echo '```'
            cat "$OUT/SHA256SUMS.txt"
            echo '```'
          } > "$notes"
          assets=("$OUT"/*.zip "$OUT/app.asar" "$OUT/SHA256SUMS.txt" "$OUT/RELEASE.json" "$OUT/PACKAGE-VERIFICATION.json" "$OUT/START-HERE.txt" "$OUT/manifest.unsigned.json")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --draft --title "Money Printer OS $tag" --notes-file "$notes"
          fi
