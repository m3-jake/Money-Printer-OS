# Money Printer OS — CI. Same checks a contributor runs locally (README "Running it"): the full
# node:test suite, the in-process self-test and the offline doctor. No network providers are
# touched (MODE=paper, DOCTOR_OFFLINE=1) and nothing here can arm live execution.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # engines.node >=22; developed against 24
    env:
      MODE: paper
      DOCTOR_OFFLINE: '1'
      FORCE_COLOR: '0'
      MONEY_PRINTER_DATA_DIR: ${{ runner.temp }}/mpo-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # tests/visual-assets.test.mjs shells out to python3 + Pillow to inspect the shipped artwork.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test suite
        run: npm run test:all

      - name: Self-test
        run: npm run selftest

      - name: Doctor (offline)
        run: node src/doctor.js --offline
